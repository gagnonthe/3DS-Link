      - name: Enregistrer la v0.5
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add source/main.cpp README.md VERSION

          if git diff --cached --quiet; then
            echo "La v0.5 est deja installee."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "3DS Link v0.5 - Live Camera"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Declencher automatiquement la compilation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build.yml --ref main
          echo "Compilation v0.5 declenchee."
