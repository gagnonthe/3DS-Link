      - name: Enregistrer la v1.3
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/main.cpp README.md VERSION
          if git diff --cached --quiet; then
            echo "La v1.3 est deja installee."
          else
            git commit -m "3DS Link v1.3 - tactile launcher and QR"
            git push
          fi

      - name: Declencher automatiquement la compilation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build.yml --ref main
