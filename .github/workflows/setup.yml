      - name: Enregistrer la v1.4
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add source/main.cpp VERSION README.md docs

          if git diff --cached --quiet; then
            echo "La v1.4 est deja installee."
          else
            git commit -m "3DS Link v1.4 - PWA pairing and fullscreen camera"
            git push
          fi

      - name: Declencher la compilation 3DS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build.yml --ref main
          echo "Compilation 3DS v1.4 declenchee."
