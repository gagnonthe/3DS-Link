      - name: Enregistrer la v0.9
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/main.cpp README.md VERSION

          if git diff --cached --quiet; then
            echo "La v0.9 est deja installee."
          else
            git commit -m "3DS Link v0.9 - instant iPhone sync"
            git push
          fi

      - name: Declencher automatiquement la compilation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build.yml --ref main
